[pytest]
# Put the src folder on the import path so tests can do "from calculator import
# Calculator" without any packaging or installation step.
pythonpath = src

# A bare "pytest" run collects only the student skeletons. Run the model
# answers explicitly with "pytest solutions".
testpaths = tests

# Show a one-line reason for every skipped TODO so progress is visible.
addopts = -ra
